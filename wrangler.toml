name = "mimo-tts-studio"
main = "src/worker.js"
compatibility_date = "2025-01-01"

# 静态资源（public/）由 Worker 托管
[assets]
directory = "./public"
binding = "ASSETS"

# 配置 + 历史记录元数据（同库：config 表 + history 表；v3.1 起弃用 KV）
[[d1_databases]]
binding = "HISTORY_DB"
database_name = "mimo-tts-db"
database_id = "94a2599e-4345-4ac3-8e67-9b80beb46662"

# 历史音频文件
[[r2_buckets]]
binding = "AUDIO_BUCKET"
bucket_name = "mimo-tts-audio"

[vars]
UPSTREAM_URL = "https://api.xiaomimimo.com/v1/chat/completions"
# 历史记录最大保留条数（超出自动清理最旧的）
HISTORY_LIMIT = "100"

# 机密（wrangler secret put 设置）:
#   MIMO_API_KEY — 上游 TTS 密钥（唯一来源，浏览器不接触）
#   CONFIG_TOKEN — 访问令牌，所有 /api/* 请求需带 X-Config-Token
