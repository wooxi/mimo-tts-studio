name = "mimo-tts-studio"
main = "src/worker.js"
compatibility_date = "2025-10-01"

# 静态资源由 Worker 托管，无构建步骤。
# 安全响应头由 src/worker.js 对每个响应下发（public/_headers 对 Worker 响应无效）。
# run_worker_first 需要 wrangler ≥ 4.41；CI 必须先 npm ci，见 .github/workflows/deploy.yml。
[assets]
directory = "./public"
binding = "ASSETS"
run_worker_first = true

# 配置 + 历史元数据 + 用量
[[d1_databases]]
binding = "HISTORY_DB"
database_name = "mimo-tts-db"
database_id = "94a2599e-4345-4ac3-8e67-9b80beb46662"

# 历史音频
[[r2_buckets]]
binding = "AUDIO_BUCKET"
bucket_name = "mimo-tts-audio"

[vars]
# 上游端点（按量付费 / Token Plan 二选一）：
#   https://api.xiaomimimo.com/v1/chat/completions
#   https://token-plan-cn.xiaomimimo.com/v1/chat/completions
UPSTREAM_URL = "https://api.xiaomimimo.com/v1/chat/completions"

# 历史保留条数（超出后清理最旧的未收藏项）
HISTORY_LIMIT = "200"

# 单个音频对象的硬上限（字节）
MAX_AUDIO_BYTES = "26214400"

# 签名播放链接的有效期（秒）
AUDIO_URL_TTL = "1800"

# 本地假上游（仅开发）：MIMO_MOCK = "1"
# 跨域白名单（可选）：ALLOWED_ORIGINS = "https://example.com"

# 机密（wrangler secret put）：
#   MIMO_API_KEY  上游密钥（必需）
#   CONFIG_TOKEN  访问令牌（必需；未设置时服务端拒绝所有请求）
