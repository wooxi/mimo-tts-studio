<!DOCTYPE html>
<html lang="zh-CN" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MiMo TTS Studio</title>
<link rel="stylesheet" href="/css/tokens.css">
<link rel="stylesheet" href="/css/main.css">
</head>
<body>

<header class="topbar">
  <div class="brand">
    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">
      <line x1="4" y1="9" x2="4" y2="15"/><line x1="8" y1="5" x2="8" y2="19"/>
      <line x1="12" y1="8" x2="12" y2="16"/><line x1="16" y1="3" x2="16" y2="21"/>
      <line x1="20" y1="10" x2="20" y2="14"/>
    </svg>
    MiMo TTS Studio
  </div>
  <div class="segmented" id="modelTabs" role="tablist" aria-label="模型切换"></div>
  <div class="topbar-spacer"></div>
  <div class="sync-dot" id="syncBadge"><span class="dot"></span><span class="txt"></span></div>
  <button class="icon-btn" id="themeToggle" aria-label="切换主题">🌓</button>
  <button class="icon-btn" id="settingsBtn" aria-label="设置">⚙</button>
</header>

<div class="workspace">
  <!-- 创作区 -->
  <section class="pane-composer" aria-label="创作区">
    <div>
      <div class="field-label">合成文本 <span class="hint">assistant message</span></div>
      <textarea id="textInput" class="text-main" placeholder="Hey boss — guess what? I just got the results back and I actually passed!"></textarea>
    </div>

    <div class="chip-row" id="chipRow" aria-label="已选风格标签"></div>

    <div class="tags-panel" id="tagsPanel" aria-label="标签面板"></div>

    <div>
      <div class="field-label">风格描述 <span class="hint">可选 · user message</span></div>
      <textarea id="styleInput" rows="2" placeholder="Bright, bouncy, slightly sing-song tone — fast pace, rising pitch at the end."></textarea>
    </div>

    <div class="fold" id="directorFold">
      <button class="fold-head" type="button">导演模式</button>
      <div class="fold-body">
        <textarea id="directorRole" rows="2" placeholder="角色：百年门阀岑家的现任大当家…"></textarea>
        <textarea id="directorScene" rows="2" placeholder="场景：在祠堂的阴影里…"></textarea>
        <textarea id="directorGuide" rows="2" placeholder="指导：冰冷、慵懒却极具威压的低音御姐…"></textarea>
      </div>
    </div>

    <div class="model-card" id="modelCard" aria-label="模型设置"></div>

    <div class="status" id="statusArea"></div>
    <div id="progressArea" hidden><div class="note mono" id="progressText">连接中…</div></div>

    <div class="synth-wrap">
      <button class="synth-btn" id="synthesizeBtn">合&nbsp;成 <kbd id="kbdHint"></kbd></button>
    </div>
  </section>

  <!-- 输出区 -->
  <section class="pane-output" id="paneOutput" aria-label="输出区">
    <div class="output-head">
      <span>输出 · 历史</span>
    </div>

    <div class="player-card model-card" id="playerSection" hidden>
      <div class="waveform"><canvas id="waveformCanvas"></canvas></div>
      <div class="player-controls">
        <button class="play-btn" id="playBtn" aria-label="播放">▶</button>
        <div class="progress-bar" id="progressBar"><div class="progress-fill" id="progressFill"></div></div>
        <span class="player-meta mono" id="timeDisplay" style="margin:0">0:00 / 0:00</span>
      </div>
      <div class="player-meta">
        <span id="durationInfo">—</span>
        <a href="#" id="downloadLink" download="tts-output.wav">下载 ↓</a>
      </div>
    </div>

    <div class="empty" id="emptyState">
      <svg width="44" height="44" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
        <line x1="4" y1="9" x2="4" y2="15"/><line x1="8" y1="5" x2="8" y2="19"/>
        <line x1="12" y1="8" x2="12" y2="16"/><line x1="16" y1="3" x2="16" y2="21"/>
        <line x1="20" y1="10" x2="20" y2="14"/>
      </svg>
      <p>输入文本，点击「合成」开始</p>
      <p style="font-size:0.75rem">结果会自动保存到历史，点击任意条目可回放</p>
    </div>

    <div class="history-list" id="historyList"></div>
  </section>
</div>

<!-- 设置抽屉 -->
<div class="drawer-mask" id="drawerMask"></div>
<aside class="drawer" id="settingsDrawer" aria-label="设置">
  <div class="drawer-head">
    <h2>设置</h2>
    <button class="icon-btn" id="drawerClose" aria-label="关闭">✕</button>
  </div>

  <div>
    <div class="field-label">访问令牌 <span class="hint" id="tokenStatus"></span></div>
    <input type="password" id="tokenInput" placeholder="Worker 的 CONFIG_TOKEN" autocomplete="off">
    <p class="note">服务端设置了 CONFIG_TOKEN 时必填，仅存于本浏览器。</p>
  </div>

  <div>
    <div class="field-label">音频格式</div>
    <div class="segmented" style="width:100%">
      <button type="button" style="flex:1" data-format="wav" onclick="document.querySelector('input[name=format][value=wav]').click()">WAV</button>
      <button type="button" style="flex:1" data-format="pcm16" onclick="document.querySelector('input[name=format][value=pcm16]').click()">PCM16</button>
    </div>
    <div hidden>
      <input type="radio" name="format" value="wav">
      <input type="radio" name="format" value="pcm16">
    </div>
  </div>

  <div class="toggle-row">
    <span class="lbl">流式输出</span>
    <div class="toggle" id="streamToggle" role="switch" tabindex="0"><input type="checkbox"></div>
  </div>
  <p class="note" id="streamNote"></p>

  <div class="status" id="settingsStatus"></div>

  <div style="margin-top:auto">
    <div class="field-label">API Key</div>
    <p class="note">密钥只保存在 Cloudflare（Secret：<span class="mono">MIMO_API_KEY</span>），浏览器不接触。如需更换：<br>
    <span class="mono" style="font-size:0.7rem">wrangler secret put MIMO_API_KEY</span></p>
  </div>
</aside>

<script type="module" src="/js/main.js"></script>
</body>
</html>
